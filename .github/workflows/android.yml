name: Android CI

on:
  push:
    paths: ["android/**", "ci/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "ci/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache exported TFLite models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/yolo11n.tflite
            android/app/src/main/assets/yolo11s.tflite
          key: yolo11-tflite-v1-${{ hashFiles('android/scripts/export-models.sh') }}
      - name: Export YOLO11 n/s to TFLite
        if: steps.models.outputs.cache-hit != 'true'
        run: bash scripts/export-models.sh
      - name: Unit tests and APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCountTraffic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks-for-emulator
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  release:
    name: Publish APK to a GitHub Release (on tags v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FreeCountTraffic-debug-apk
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/app-debug.apk "dist/FreeCountTraffic-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "dist/FreeCountTraffic-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  emulator:
    name: Emulator smoke tests + screenshots
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks-for-emulator
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # TensorFlow Lite ships x86 and x86_64 libraries; the 32-bit image is the one this job was validated with.
          arch: x86
          target: google_apis
          disable-animations: true
          script: bash android/ci/emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots-and-logs
          path: |
            screenshots/
            instrument.log
            logcat_autotest.txt
