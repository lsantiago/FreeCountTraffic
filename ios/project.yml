# XcodeGen spec used by CI (macOS runner): `xcodegen generate` -> FreeCountTraffic.xcodeproj
name: FreeCountTraffic
options:
  bundleIdPrefix: com.freecount
  deploymentTarget:
    iOS: "16.0"
packages:
  TrafficCorePackage:
    path: .
targets:
  FreeCountTraffic:
    type: application
    platform: iOS
    sources:
      - path: Sources/FreeCountTraffic
        excludes:
          - "Resources/**"
      # Core ML packages are folders: list them explicitly as single files so Xcode compiles them to .mlmodelc
      - path: Sources/FreeCountTraffic/Resources/yolo11n.mlpackage
        type: file
        buildPhase: sources
      - path: Sources/FreeCountTraffic/Resources/yolo11s.mlpackage
        type: file
        buildPhase: sources
      - path: Sources/FreeCountTraffic/Resources/yolo11m.mlpackage
        type: file
        buildPhase: sources
      # app icon (generated by ../tools/make_icons.py); kept outside Sources so SwiftPM/xtool ignore it
      - path: AppIcon/Assets.xcassets
    dependencies:
      - package: TrafficCorePackage
        product: TrafficCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freecount.traffic
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets:
        - TrafficCoreTests
  TrafficCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TrafficCoreTests
    dependencies:
      - package: TrafficCorePackage
        product: TrafficCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
